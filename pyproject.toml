
[project]
name = "mediainsight"
version = "0.1.0"
description = "Engenharia de Dados e Marketing Analytics com GA4"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb>=1.3,<2",
    "pytz>=2026.6",
]

[project.scripts]
mediainsight = "mediainsight.main:main"
mediainsight-ingest = "mediainsight.run_ingestion:main"
mediainsight-transform = "mediainsight.run_transform:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
